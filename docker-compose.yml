# Docker Compose 部署。
#
# 用法：
#   1) 在同目录建 .env（可选，但推荐）写上两个密钥：
#        ZCODE_ADMIN_KEY=你的后台密码
#        ZCODE_GATEWAY_KEY=sk-你的网关密钥
#      不写也行——首次启动会随机生成并打到日志里。
#   2) docker compose up -d
#   3) docker compose logs zcode2api | grep -E '初始后台密码|网关 API Key'
#
# ⚠️ 三个容易踩的坑：
#   a) 应用本身**不读 .env 文件**（只认进程环境变量，见 internal/config）。
#      同目录的 .env 之所以生效，是因为 compose 读它来做 ${VAR} 插值——因此下面每个
#      变量都必须在 environment: 里显式引用；写进 .env 却没被引用的不会进容器。
#   b) 别把 .env 放进数据卷（/data）里，应用不会读它。
#   c) 走反向代理时，把端口只映射到回环（见下方 ports 处的注释）。
#      否则所有请求的 RemoteAddr 都是代理地址，后台登录的「单 IP 失败次数」
#      会共用一个桶——任何人的十次失败都能锁死整个后台。

services:
  zcode2api:
    # 默认从源码构建，开箱即用、不依赖镜像是否已发布。
    # CI 推 v* tag 后会把 linux/amd64 + linux/arm64 多架构镜像发到 GHCR，
    # 届时可注释掉 build: 并改用镜像（更省事，也省下本地 Go 构建）：
    #   image: ghcr.io/fujunchao/zcode2api-plus:latest
    build: .
    image: zcode2api-plus:latest
    container_name: zcode2api
    restart: unless-stopped
    # 容器内会拉起 Chromium 子进程，用 init 收尸，避免僵尸进程堆积
    init: true
    ports:
      # 直连访问（浏览器直接开 http://<主机>:3000）就保持原样。
      # 若前面挂了 Nginx / Caddy 等反向代理，请改成只绑回环：
      #   - "127.0.0.1:${ZCODE_PORT:-3000}:${ZCODE_PORT:-3000}"
      # 原因：反代转发后 RemoteAddr 恒为代理地址，后台登录的「单 IP 10 次失败」
      # 限速会变成全局限速，任何人的失败都能锁死整个后台；只绑回环可确保
      # 外部只能经反代进来，同时让限速桶不再对外部流量生效。
      - "${ZCODE_PORT:-3000}:${ZCODE_PORT:-3000}"
    environment:
      ZCODE_PORT: ${ZCODE_PORT:-3000}
      ZCODE_HOST: 0.0.0.0
      ZCODE_DATA_DIR: /data
      # 密钥初始值：留空 → 首次启动随机生成并打到日志；写入数据库后以库为准
      ZCODE_ADMIN_KEY: ${ZCODE_ADMIN_KEY:-}
      ZCODE_GATEWAY_KEY: ${ZCODE_GATEWAY_KEY:-}
      # 验证码浏览器池：JWT 账号自动过验证码必需。首次用到时自动下载约 200MB
      # 补丁 Chromium 到 /data/cloakbrowser（只需一次，走卷持久化）。
      # 只用 API Key 账号、或打算后台人工回填，可设 "false" 免掉这 200MB。
      ZCODE_CAPTCHA_BROWSER: ${ZCODE_CAPTCHA_BROWSER:-true}
      # 后台自动刷新额度的间隔（秒），0 关闭
      ZCODE_QUOTA_REFRESH_INTERVAL: ${ZCODE_QUOTA_REFRESH_INTERVAL:-60}
      # 限流冷却时长（秒）
      ZCODE_COOLING_SECONDS: ${ZCODE_COOLING_SECONDS:-300}
      # 代理线路自动巡检：检测不通过的线路自动移除并改派绑定账号（分钟间隔）
      ZCODE_PROXY_HEALTH_ENABLED: ${ZCODE_PROXY_HEALTH_ENABLED:-true}
      ZCODE_PROXY_HEALTH_INTERVAL: ${ZCODE_PROXY_HEALTH_INTERVAL:-30}
      # 上游风控（HTTP 405 + unusual activity）的递进冷却阶梯（秒，逗号分隔）。
      # 档位数即升级点：连续命中超过档位数则账号置为失效，需人工介入。
      ZCODE_RISK_COOLING_STEPS: ${ZCODE_RISK_COOLING_STEPS:-300,900,3600}
      # ── Async 空闲池（POST /async/v1/messages）────────────────────────────
      # 票务总超时（秒）。**这是整票的墙钟寿命，不是空闲超时**：自建票起算，到点即向
      # 客户端投递 ticket_timeout 错误事件并中止后台任务。需要 5 分钟以上思考的请求
      # 若不调高，必然被它截断——这一点与 sync /v1/messages 不同（后者没有总超时）。
      # 下限 30，调大不设上限（孤儿票清扫会跟着放宽）。
      ZCODE_ASYNC_TICKET_TIMEOUT: ${ZCODE_ASYNC_TICKET_TIMEOUT:-300}
      # 是否挂载 /async/v1/messages
      ZCODE_ASYNC_ENABLED: ${ZCODE_ASYNC_ENABLED:-true}
      # 已建票但一个 chunk 都没收到时的换号重试次数；已有 chunk 后中断一律不重试
      ZCODE_ASYNC_MAX_RETRIES: ${ZCODE_ASYNC_MAX_RETRIES:-3}
      # 排障控制开关：强制 async 忽略账号代理、恒直连上游（默认关）。
      # 用途是保留「线路侧 vs 上游侧」断流归因的直连对照臂——开启后配了代理的账号会以
      # 服务器真实 IP 直连上游（IP 绑定/地区要求/避风控失效）。这里只是默认值，
      # 落库后以后台「系統設定 → Async 強制直連」的开关为准。
      ZCODE_ASYNC_FORCE_DIRECT: ${ZCODE_ASYNC_FORCE_DIRECT:-false}
    volumes:
      # 必须持久化：accounts.db + device_mid.txt + 补丁 Chromium 都在这里。
      # device_mid 每次重建都变会被上游当成新设备（风控）。
      - zcode-data:/data
      # 想沿用宿主机既有的 ./data 目录，改用下面这行，并先对齐属主
      #（镜像以 uid 10001 非 root 运行）：sudo chown -R 10001:10001 ./data
      # - ./data:/data
    # 若改用 bind mount 又不想 chown，可取消注释改以 root 运行
    #（--no-sandbox 已内置于 rod 启动参数，不会撞沙箱）
    # user: "0:0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  zcode-data:
