# zcode2api-go 一键部署；数据卷 /data（账号库、密钥、设备指纹）。
# 验证码浏览器池默认开启；显存受限环境可设 ZCODE_CAPTCHA_BROWSER=false 走人工回填。
services:
  zcode2api:
    build: .
    image: zcode2api-go:latest
    container_name: zcode2api-go
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - ZCODE_CAPTCHA_BROWSER=true
      #shm_size 供 Chromium 使用（rod 默认带 --disable-dev-shm-usage，此项为双保险）
    shm_size: "256m"
    volumes:
      - ./data:/data
