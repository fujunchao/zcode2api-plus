# CI：工作流检查 + 编译 + 静态检查 + 全量测试（含 -race）。
#
# 自动化验证统一在 GitHub Actions 的 Ubuntu 环境执行，本机只做开发与格式化。
# 分支提交和发布门禁复用本文件，不另维护一套发版测试脚本。
# 为什么不再在本机重复测试：
#   1. 冷缓存下首次本机构建要编译 modernc.org/libc（纯 Go 转译的 SQLite）与 rod，
#      实测十余分钟；CI 有 go build cache，重复运行只需几分钟。
#   2. `-race` 需要 gcc/cc，本机没有，CI 的 ubuntu-latest 自带——这正好解掉
#      HANDOFF/PLAN 里「M5/M6 的 -race 验收本机做不了」这条欠账。
#   3. 避免本机 Windows 临时目录清理等环境噪声，不降低测试覆盖率。
#
# 全量测试均为 httptest 本地环回或显式 t.Skip（真机用例需 ZCODE_REAL_BROWSER_TEST=1），
# 故 test / cross-build 两个 job 不触网、不需要浏览器。docker job 需要联网
# （拉基础镜像、apt 装 Chromium 运行库、go mod download）。
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      platforms:
        description: "验证镜像构建的平台（只构建，不推送）"
        type: string
        required: false
        default: "linux/amd64"
  workflow_dispatch:
    inputs:
      # 手动触发时可指定多个平台，用来验证 release.yml 的多架构路径（含 QEMU 下的
      # 运行阶段 apt），而不必真的推 tag 发版。默认只构建 Ubuntu runner 的平台。
      platforms:
        description: "镜像构建平台（逗号分隔）"
        type: string
        required: false
        default: "linux/amd64"

permissions:
  contents: read

concurrency:
  # 被复用时 github.workflow 是调用方名称：隔离分支 CI 与发布验证，避免互相取消。
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint -- src test
      - name: Test frontend behavior
        working-directory: frontend
        run: npm test
      - name: Verify embedded frontend
        working-directory: frontend
        run: |
          # 历史产物不应参与 Tailwind 扫描；残留类不能污染下一次构建。
          printf '<div class="m-[12347px]"></div>\n' > dist/source-scan-probe.html
          npm run build
          git diff --exit-code -- dist
          test -z "$(git ls-files --others --exclude-standard -- dist)"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # 近期失败线路避让、逐次出站和并发改派使用真实本地 HTTP/SQLite 边界重复验证。
      - name: Test risk proxy regression (repeat)
        run: go test ./internal/store ./internal/gateway ./internal/asyncpool -run 'TestRiskProxy|TestAttemptLog|TestAsyncRiskProxy|TestAsyncForcedDirect|TestRotateAccountProxy|TestConcurrentRiskResponses|TestProxyMutationFailureIsAtomic' -count=20 -timeout=180s

      - name: Test proxy deletion regression (repeat)
        run: |
          go test ./internal/store -run 'TestDeleteProxy|TestConcurrentDeleteProxies' -count=20 -timeout=180s
          go test ./internal/adminapi -run '^TestDeleteProxySharesOccupiedProxy$' -count=20 -timeout=60s

      # 新号领取、缓存失效、双次空额度原子改派与老账号保护均使用隔离数据和本地服务。
      - name: Test new account quota regression (repeat)
        run: go test ./internal/adminapi ./internal/quota ./internal/store -run 'TestNewAccount|TestExistingAccount.*(ClaimRisk|EmptyQuota|Relogin)|TestExistingBatchClaim|TestImportedAccounts|TestFetchQuotaFresh|TestRefreshAccountsObserved' -count=20 -timeout=180s

      # 竞态检查单独一步：失败时能一眼看出是数据竞争而非普通断言失败。
      # -count=1 关掉测试结果缓存：竞态是时序相关的，缓存下来的 PASS 不能当作
      # 「这次真的跑过检测器」。编译缓存仍然生效，代价只是重跑一次测试。
      - name: Test (race)
        run: go test -race -count=1 ./...

  # 真实客户端只连接 httptest，不读取账号、不访问真实模型；SDK 依赖安装在临时目录。
  sdk-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install test-only clients
        run: |
          python -m pip install openai==2.30.0
          npm install --prefix "$RUNNER_TEMP/pi-client" --ignore-scripts --no-audit --no-fund @earendil-works/pi-ai@0.85.1
      - name: Test official SDK and Pi adapter
        env:
          ZCODE_TEST_CLIENTS: python,pi
          ZCODE_PI_AI_MODULE: ${{ runner.temp }}/pi-client/node_modules/@earendil-works/pi-ai/dist/api/openai-completions.js
        run: go test -race -count=1 -timeout=180s ./internal/openai -run '^TestClientSDKCompatibility$' -v

  # 平台矩阵下只做编译：确认可交叉编译（与 release.yml 的目标一致），不重复跑测试
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/zcode2api

  # 镜像构建守门员：本地不一定装了 Docker（本仓库开发者机器就没有），
  # 所以 Dockerfile 的正确性只能靠这里保证。只构建不推送，推送上 GHCR 在 release.yml。
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          # 常规运行只验 Ubuntu runner 的平台（快）；手动触发可传多平台验发布路径。
          # 始终不推送——推 GHCR 只在 release.yml 推 tag 时发生。
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
