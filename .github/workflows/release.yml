# Release CI：推 tag（v*）时构建跨平台产物并上传到 GitHub Releases。
# 前端 dist 已提交且 go:embed，无需 node 构建；CGO 关闭纯静态编译。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          OUT="zcode2api-${GOOS}-${GOARCH}${EXT}"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$OUT" ./cmd/zcode2api

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: zcode2api-*
