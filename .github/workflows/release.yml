# Release CI：推 tag（v*）时构建跨平台产物并上传到 GitHub Releases。
# 前端 dist 已提交且 go:embed，无需 node 构建；CGO 关闭纯静态编译。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          OUT="zcode2api-${GOOS}-${GOARCH}${EXT}"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$OUT" ./cmd/zcode2api

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: zcode2api-*

  # 多架構容器鏡像 → ghcr.io/<repo>。linux/amd64 與 linux/arm64 都有 cloakbrowser
  # 的預構建補丁 Chromium，故兩個架構都能自動求解驗證碼。
  # 構建階段用 $BUILDPLATFORM（原生速度）交叉編譯，故 QEMU 只需支撐運行階段的 apt。
  #
  # ⚠️ 首次推送後，GHCR 套件預設是 private：要在
  #    GitHub → 該 package 的 Settings → Change visibility 改成 Public，
  #    否則別人 pull 需要先 docker login。
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # 只出两个标签：完整版本 + latest。
          # 不加 `{{major}}.{{minor}}` 滚动标签：本项目 tag 带 `-go` 后缀（如 v2.0.2-go），
          # semver 会把 `-go` 解析成 prerelease，该模式会因此生成一个误导性的 `2.2`。
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
